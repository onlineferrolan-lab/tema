    PS_IMAGE_QUALITY: png
  modules:
    to_enable:
      - ps_linklist
      - ecommbanners
      - ecommbaseconfiguration
      - ecommowlslider
      - ecommslider
      - ecommzoom
      - ets_advancedcaptcha
      - ecomminfinitescroll
      - ecommselectqtyproduct
      - prestasmartwishlist
      - ecommsearchbar
      - ecommwpo
      - ecommcategories
      - ecommStoreLocator
      - ecommhomeproducts
      - ecommprettyinputs
      - iqitmegamenu
    to_disabled:
      - ps_mainmenu
      - ps_facetedsearch
      - ps_searchbar
      - ps_imageslider
      - ps_featuredproducts
      - ps_banner
      - ps_dataprivacy
      - gamification
      - statsstock
      - statscarrier
      - statscheckup
      - statspersonalinfos
      - statsbestsuppliers
      - pagesnotfound
  hooks:
