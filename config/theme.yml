      displayNavFullWidth:
      displayNav1:
      displayNav2:
      displaySearch:
        - ecommsearchbar
      displayTop:
        - ps_customersignin
        - ps_shoppingcart
      displayHome:
        - ecommslider
        - ecommbanners
        - ps_customtext
      displayFooterBefore:
        - blockreassurance
        - ps_emailsubscription
      displayFooter:
        - ps_linklist
        - ps_contactinfo
        - ps_socialfollow
      displayFooterAfter:
        - blockreassurance
      displayLeftColumn:
        - ps_categorytree
        - ps_facetedsearch
      displayProductAdditionalInfo:
        - ps_sharebuttons
      displayReassurance:
        - blockreassurance
      displayOrderConfirmation2:
        - ps_featuredproducts
      displayCrossSellingShoppingCart:
        - ps_featuredproducts
      displayBackOfficeHeader:
        - ecommbanners
      displayHeader:
        - ecommbanners
        - ecommbaseconfiguration
        - ecommowlslider
        - ecommprettyinputs
        - ecommslider
        - ecommzoom
        - ets_advancedcaptcha
        - ecomminfinitescroll
        - prestasmartwishlist
        - ecommsearchbar
        - ecommwpo
        - ecommcategories
        - ecommStoreLocator
        - ecommhomeproducts
        - iqitmegamenu
      ecommbanners:
        - ecommbanners
      displayBanner:
        - ecommbanners
      displaytop:
        - ps_languageselector
        - prestasmartwishlist
        - ps_customersignin
        - ps_shoppingcart


  image_types:
